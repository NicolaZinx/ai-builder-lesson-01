<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>互动情景剧</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2d36;
        --muted: #667782;
        --line: rgba(31, 45, 54, 0.16);
        --panel: rgba(255, 255, 255, 0.92);
        --paper: #ffffff;
        --teal: #137f84;
        --teal-dark: #0b6267;
        --amber: #e8b13f;
        --blue: #2f5f86;
        --rose: #9f5d6f;
        --blackboard: rgba(23, 27, 28, 0.86);
        --shadow: 0 26px 80px rgba(28, 45, 54, 0.2);
        --radius: 8px;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      .stage,
      .stage * {
        caret-color: transparent;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 14px;
        color: var(--ink);
        background:
          linear-gradient(135deg, #eff5f2 0%, #edf1f5 46%, #f6f0e7 100%),
          #edf2f1;
      }

      button {
        font: inherit;
      }

      .stage-wrap {
        width: min(1280px, calc(100vw - 28px), calc((100vh - 28px) * 16 / 9));
        aspect-ratio: 16 / 9;
        position: relative;
      }

      .stage {
        position: absolute;
        inset: 0 auto auto 0;
        width: 1280px;
        height: 720px;
        transform: scale(var(--stage-scale, 1));
        transform-origin: top left;
        min-height: 0;
        overflow: hidden;
        background: #e8eef0;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .background {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        transition: opacity 260ms ease, filter 260ms ease;
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(13, 30, 37, 0.06), rgba(13, 30, 37, 0.02) 48%, rgba(13, 30, 37, 0.28)),
          linear-gradient(90deg, rgba(13, 30, 37, 0.16), rgba(13, 30, 37, 0.02) 42%, rgba(13, 30, 37, 0.12));
        pointer-events: none;
      }

      .stage[data-mode="cover"] .topbar,
      .stage[data-mode="ending"] .topbar,
      .stage[data-mode="cover"] .shade,
      .stage[data-mode="intertitle"] .shade,
      .stage[data-mode="ending"] .shade {
        display: none;
      }

      .topbar {
        position: absolute;
        top: 14px;
        left: 16px;
        right: 16px;
        z-index: 20;
        display: grid;
        grid-template-columns: auto 1fr auto auto auto;
        gap: 10px;
        align-items: center;
      }

      .chapter-chip,
      .tool-button {
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        color: #fff;
        background: rgba(24, 38, 45, 0.58);
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: var(--radius);
        backdrop-filter: blur(12px);
        font-size: 0.88rem;
        font-weight: 700;
      }

      .tool-button {
        width: 38px;
        padding: 0;
        cursor: pointer;
      }

      .tool-button.is-active {
        background: rgba(19, 127, 132, 0.86);
        border-color: rgba(255, 255, 255, 0.46);
      }

      .tool-button svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .progress {
        height: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.42);
        border-radius: 999px;
      }

      .progress > span {
        display: block;
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #21a0a7, #f2b648);
        transition: width 260ms ease;
      }

      .screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        cursor: default;
      }

      .cover {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 560px 1fr;
        gap: 32px;
        align-items: center;
        min-height: 100%;
        overflow: hidden;
        padding: 76px 48px 64px 78px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.66) 48%, rgba(255, 255, 255, 0.42) 100%),
          var(--cover-bg) center / cover;
      }

      .cover h1 {
        margin: 0;
        font-size: 5.1rem;
        line-height: 0.98;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .cover .subtitle {
        max-width: 720px;
        margin: 14px 0 0;
        color: #56656e;
        font-size: clamp(1.18rem, 2vw, 1.45rem);
        line-height: 1.8;
      }

      .cover .subtitle-title {
        max-width: 720px;
        margin: 18px 0 0;
        color: #263844;
        font-size: clamp(1.35rem, 2.35vw, 1.85rem);
        line-height: 1.35;
        font-weight: 800;
      }

      .start-button,
      .continue-button,
      .choice-button {
        border: 0;
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 700;
      }

      .start-button {
        min-width: 160px;
        min-height: 50px;
        margin-top: 34px;
        padding: 0 24px;
        color: #fff;
        background: var(--teal);
      }

      .start-button:hover,
      .continue-button:hover {
        background: var(--teal-dark);
        color: #fff;
      }

      .cover-people {
        position: relative;
        height: 580px;
        min-height: 580px;
        overflow: hidden;
      }

      .cover-people img {
        position: absolute;
        bottom: 8px;
        height: 92%;
        max-height: none;
        object-fit: contain;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 88%, rgba(0, 0, 0, 0.72) 94%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 0%, #000 88%, rgba(0, 0, 0, 0.72) 94%, transparent 100%);
        filter: drop-shadow(0 20px 24px rgba(21, 35, 42, 0.24));
      }

      .cover-people .xiaoye {
        right: 20px;
        width: auto;
        z-index: 2;
      }

      .cover-people .xiaoou {
        left: -10px;
        width: auto;
        z-index: 1;
      }

      .intertitle {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 40px;
        color: #fff;
        background:
          linear-gradient(180deg, rgba(6, 10, 13, 0.7), rgba(6, 10, 13, 0.88)),
          var(--intertitle-bg) center / cover;
        text-align: center;
      }

      .intertitle h2 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 5.4rem);
        font-weight: 500;
      }

      .intertitle p {
        margin: 18px 0 0;
        color: rgba(255, 255, 255, 0.74);
        font-size: clamp(1.1rem, 2.4vw, 1.5rem);
      }

      .intertitle .continue-button {
        margin-top: 34px;
        min-width: 132px;
      }

      .characters {
        position: absolute;
        inset: 58px 4% 126px;
        z-index: 8;
        pointer-events: none;
      }

      .character {
        position: absolute;
        bottom: 0;
        width: min(37vw, 470px);
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 220ms ease, transform 220ms ease, filter 220ms ease;
      }

      .character.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .character.left {
        left: 5%;
      }

      .character.right {
        right: 4%;
      }

      .character.dimmed {
        filter: saturate(0.72) brightness(0.78);
      }

      .character img {
        width: auto;
        max-width: none;
        height: 116%;
        max-height: none;
        object-fit: contain;
        transform: translateY(10%);
        filter: drop-shadow(0 18px 22px rgba(16, 28, 36, 0.28));
      }

      .dialogue {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 26px;
        z-index: 18;
        height: 148px;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        column-gap: 12px;
        row-gap: 10px;
        align-items: center;
        padding: 18px 22px 18px 24px;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-left: 5px solid var(--speaker-color, var(--teal));
        border-radius: var(--radius);
        box-shadow: 0 18px 52px rgba(18, 34, 42, 0.18);
        backdrop-filter: blur(18px);
      }

      .dialogue-content {
        grid-column: 1 / 7;
        min-width: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        align-content: center;
        min-height: 100%;
      }

      .dialogue.npc-side .continue-button {
        position: absolute;
        left: 50%;
        bottom: -6px;
        transform: translateX(-50%);
      }

      .dialogue.player-side .dialogue-content {
        grid-column: 7 / 13;
        padding-right: 0;
      }

      .dialogue.player-side .continue-button {
        position: absolute;
        left: 50%;
        bottom: -6px;
        transform: translateX(-50%);
      }

      .system-dialogue .dialogue-content {
        grid-column: 1 / 13;
        padding-right: 0;
      }

      .system-dialogue .continue-button {
        position: absolute;
        left: 50%;
        bottom: -6px;
        transform: translateX(-50%);
      }

      .dialogue-content.no-speaker {
        grid-template-rows: 1fr;
      }

      .dialogue-content.has-status {
        grid-template-rows: 26px minmax(0, 1fr);
        row-gap: 4px;
      }

      .speaker {
        display: inline-flex;
        max-width: 100%;
        width: max-content;
        height: 24px;
        margin: 0;
        padding: 2px 10px;
        color: #fff;
        background: color-mix(in srgb, var(--speaker-color, var(--teal)) 92%, #111);
        border-radius: 6px;
        font-weight: 700;
        align-items: center;
        font-size: 0.9rem;
      }

      .line {
        margin: 0;
        font-size: clamp(1.12rem, 1.75vw, 1.42rem);
        line-height: 1.68;
        max-width: 100%;
        min-height: 3.36em;
      }

      .status-inline {
        font-family: KaiTi, STKaiti, "Kaiti SC", "楷体", serif;
        font-weight: 700;
        color: color-mix(in srgb, var(--speaker-color, var(--teal)) 90%, #111);
      }

      .system-dialogue {
        border-left-color: rgba(24, 38, 45, 0.28);
      }

      .continue-button {
        align-self: center;
        min-width: 160px;
        min-height: 44px;
        padding: 0 24px;
        color: #111827;
        background: transparent;
        border: 0;
        box-shadow: none;
        font-size: 1.78rem;
        font-weight: 900;
        letter-spacing: 0;
        text-shadow:
          0 2px 0 rgba(255, 255, 255, 0.86),
          0 8px 18px rgba(15, 23, 42, 0.18);
      }

      .dialogue .continue-button {
        align-self: end;
        z-index: 3;
      }

      .dialogue .continue-button:hover,
      .dialogue .continue-button:focus-visible {
        color: #0f766e;
        background: transparent;
        transform: translateX(-50%) translateY(-1px);
        box-shadow: none;
      }

      .choice-panel {
        position: absolute;
        left: 46px;
        top: auto;
        bottom: 194px;
        z-index: 22;
        width: min(640px, 48%);
        display: grid;
        gap: 12px;
      }

      .choice-question {
        margin: 0 0 2px;
        padding: 13px 16px;
        color: #fff;
        background: rgba(18, 35, 43, 0.78);
        border-radius: var(--radius);
        font-weight: 700;
        line-height: 1.55;
        backdrop-filter: blur(10px);
      }

      .choice-button {
        width: 100%;
        min-height: 58px;
        padding: 11px 16px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(31, 45, 54, 0.12);
        text-align: left;
        line-height: 1.55;
        box-shadow: 0 12px 30px rgba(22, 38, 46, 0.14);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .choice-button:hover {
        transform: translateY(-1px);
        border-color: rgba(25, 124, 132, 0.55);
        box-shadow: 0 16px 38px rgba(22, 38, 46, 0.18);
      }

      .choice-button:disabled {
        cursor: default;
        opacity: 0.72;
        transform: none;
      }

      .feedback-panel {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 30;
        width: min(640px, calc(100% - 40px));
        transform: translate(-50%, -50%);
        padding: 24px 24px 20px;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid rgba(233, 169, 63, 0.72);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .feedback-panel h3 {
        margin: 0 0 10px;
        font-size: 1.45rem;
      }

      .feedback-panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.85;
      }

      .feedback-actions {
        display: flex;
        justify-content: flex-end;
      }

      .knowledge {
        position: absolute;
        inset: 70px 42px 178px;
        z-index: 16;
        display: grid;
        grid-template-columns: 286px minmax(0, 1fr);
        gap: 30px;
        align-items: center;
        padding: 30px 36px 28px;
        color: #fff;
        background: rgba(18, 27, 30, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .knowledge h2 {
        max-width: 760px;
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 3.5vw, 3.15rem);
        line-height: 1.08;
        white-space: nowrap;
      }

      .knowledge h2.title-long {
        font-size: clamp(2.05rem, 3.05vw, 2.72rem);
        white-space: nowrap;
      }

      .knowledge h2.title-extra-long {
        font-size: clamp(1.8rem, 2.65vw, 2.38rem);
        white-space: nowrap;
      }

      .knowledge h2.title-ultra-long {
        font-size: clamp(1.45rem, 2.15vw, 1.92rem);
        white-space: nowrap;
      }

      .knowledge-content {
        grid-column: 2;
        align-self: center;
        transform: translateY(-18px);
      }

      .abc-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0 0;
      }

      .abc-grid.count-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 760px;
      }

      .abc-item {
        padding: 16px 18px;
        min-height: 116px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--radius);
      }

      .abc-item strong {
        display: block;
        margin-bottom: 8px;
        color: #ffd98d;
        font-size: 1.24rem;
      }

      .abc-item p,
      .knowledge-copy {
        max-width: 820px;
        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .knowledge .teacher-figure {
        grid-column: 1;
        align-self: end;
        justify-self: start;
        width: min(28vw, 360px);
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 18px 20px rgba(0, 0, 0, 0.36));
      }

      .ending {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 40px;
        color: #fff;
        text-align: center;
        background:
          linear-gradient(180deg, rgba(12, 30, 38, 0.5), rgba(12, 30, 38, 0.82)),
          var(--ending-bg) center / cover;
      }

      .ending-box {
        width: 800px;
        padding: 40px;
        background: rgba(15, 33, 41, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: var(--radius);
        backdrop-filter: blur(14px);
      }

      .ending h2 {
        margin: 0 0 16px;
        font-size: 3.35rem;
        line-height: 1.18;
        text-wrap: balance;
      }

      .ending p {
        margin: 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: clamp(1.08rem, 2vw, 1.35rem);
        line-height: 1.9;
      }

      .ending-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 26px;
      }

      .secondary-button {
        min-height: 46px;
        padding: 0 18px;
        color: #0f4e55;
        background: #fff;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 700;
      }

      .secondary-button:hover {
        color: #fff;
        background: var(--teal);
      }

      @media (max-width: 820px) {
        body {
          padding: 8px;
        }

        .stage-wrap {
          width: min(calc(100vw - 16px), calc((100vh - 16px) * 16 / 9));
        }

        .stage {
          min-height: 0;
          border-radius: var(--radius);
          aspect-ratio: 16 / 9;
        }

        .topbar {
          grid-template-columns: auto 1fr auto auto;
          top: 10px;
          left: 10px;
          right: 10px;
        }

        .chapter-chip {
          max-width: 138px;
          padding: 0 10px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-size: 0.86rem;
        }

        .cover {
          min-height: 100%;
          grid-template-columns: minmax(0, 0.92fr) minmax(240px, 1fr);
          align-content: center;
          padding: 32px;
        }

        .cover-people {
          min-height: 100%;
          order: initial;
        }

        .cover-people img {
          bottom: -58px;
          height: 118%;
          max-height: none;
        }

        .characters {
          inset: 70px 0 210px;
        }

        .character {
          width: 64vw;
        }

        .character.left {
          left: -7vw;
        }

        .character.right {
          right: -9vw;
        }

        .dialogue {
          left: 10px;
          right: 10px;
          bottom: 10px;
          height: auto;
          min-height: 188px;
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 14px;
        }

        .dialogue .dialogue-content,
        .dialogue.npc-side .dialogue-content,
        .dialogue.player-side .dialogue-content,
        .system-dialogue .dialogue-content,
        .dialogue .continue-button,
        .dialogue.npc-side .continue-button,
        .dialogue.player-side .continue-button,
        .system-dialogue .continue-button {
          grid-column: 1 / -1;
          justify-self: stretch;
        }

        .continue-button {
          width: 100%;
        }

        .choice-panel {
          left: 10px;
          right: 10px;
          top: auto;
          bottom: 214px;
          width: auto;
          transform: none;
        }

        .choice-character-layer {
          display: none;
        }

        .choice-button {
          min-height: 58px;
        }

        .knowledge {
          inset: 62px 10px 10px;
          grid-template-columns: 1fr;
          overflow: auto;
          padding: 18px;
        }

        .abc-grid {
          grid-template-columns: 1fr;
        }

        .abc-grid.count-4 {
          grid-template-columns: 1fr;
          max-width: none;
        }

        .knowledge .teacher-figure {
          display: none;
        }
      }

      @media (max-height: 520px) and (orientation: landscape) {
        body {
          padding: 6px;
          background: #e8eef0;
        }

        .stage-wrap {
          width: min(calc(100vw - 12px), calc((100vh - 12px) * 16 / 9));
        }

        .stage {
          min-height: 0;
          aspect-ratio: 16 / 9;
          border: 0;
          border-radius: var(--radius);
          box-shadow: none;
        }

        .topbar {
          top: 8px;
          left: 10px;
          right: 10px;
          gap: 8px;
        }

        .chapter-chip,
        .tool-button {
          height: 32px;
          font-size: 0.76rem;
        }

        .chapter-chip {
          padding: 0 10px;
        }

        .tool-button {
          width: 32px;
        }

        .tool-button svg {
          width: 17px;
          height: 17px;
        }

        .progress {
          height: 6px;
        }

        .cover {
          min-height: 100%;
          grid-template-columns: minmax(0, 0.92fr) minmax(260px, 1fr);
          gap: 12px;
          padding: 34px 36px 24px;
        }

        .cover h1 {
          font-size: clamp(2.15rem, 7vh, 3rem);
        }

        .cover .subtitle {
          max-width: 390px;
          margin-top: 12px;
          font-size: 0.9rem;
          line-height: 1.65;
        }

        .cover .subtitle-title {
          max-width: 390px;
          margin-top: 10px;
          font-size: 1.02rem;
          line-height: 1.35;
        }

        .start-button {
          min-width: 124px;
          min-height: 40px;
          margin-top: 20px;
          padding: 0 18px;
        }

        .cover-people {
          min-height: 100%;
          order: initial;
        }

        .cover-people img {
          bottom: -58px;
          height: 118%;
          max-height: none;
        }

        .cover-people .xiaoye {
          right: -6%;
        }

        .cover-people .xiaoou {
          left: -8%;
        }

        .intertitle {
          padding: 24px;
        }

        .intertitle h2 {
          font-size: clamp(2.7rem, 14vh, 4rem);
        }

        .intertitle p {
          margin-top: 10px;
          font-size: 1rem;
        }

        .intertitle .continue-button {
          width: auto;
          min-width: 112px;
          min-height: 38px;
          margin-top: 22px;
        }

        .characters {
          inset: 44px 3% 98px;
        }

        .character {
          width: min(39vw, 300px);
        }

        .character.left {

          "text": "她在宿舍接获奖电话，声音有点大。我第二天考试，那时很急。我提醒过她，她也小声了，可我还是越来越烦。",

        {
          "id": "n25",

          "text": "不完全准确。她不是完全不管我。她接电话时确实激动，但我提醒以后，她有压低声音。",

        {

          "text": "可是当时我脑子里只剩下一个想法：她明明知道我明天考试，还能这么开心。",

              "pose": "default"

        {

          "type": "dialogue",
          "speaker": "王老师",
          "text": "这个“只剩下一个想法”很关键。情绪被点燃时，我们常常以为自己看到的是事实，其实很多时候看到的是解释。",

              "pose": "thinking"
            }

          "next": "n27"
        },
        {
          "id": "n27",
          "type": "dialogue",
          "speaker": "小叶",
          "text": "我当时觉得电话声让我爆发。可现在想，电话声只是开始，后面是我一直在解释她的行为。",

            {
              "id": "wang",

            },

              "pose": "thinking",
              "active": true

          ],

        {
          "id": "n28",
          "type": "dialogue",
          "speaker": "王老师",
          "text": "这正好可以用情绪 ABC 理论来看。",

              "pose": "point",

            {
              "id": "xiaoye",

        {
          "id": "k1",
          "type": "knowledge",
          "bg": "assets/scenes/counseling_room.webp",
          "title": "情绪ABC理论",
          "copy": "情绪调节ABC理论是由美国心理学家艾尔伯特·埃利斯提出来的。我们说情绪本身并不是由诱发事件A（activating event）引起的，A只是引发情绪和行为后果C（consequence）的间接原因。而引起C的直接原因则是个体对激发事件A的认知和评价而产生的信念B（belief）。",
          "dialogueKey": "k1_dialogue",
          "dialogueSpeaker": "王老师",
          "dialogueText": "电话声确实影响了你，考试压力也是真的。但让愤怒不断升高的，是你对这件事的解释。",
          "items": [
            {
              "key": "A 诱发事件",
              "value": "小欧在宿舍接获奖电话，声音较大。"
            },
            {
              "key": "B 信念评价",
              "value": "她不该影响我；她不在乎我；她不尊重我。"
            },
            {
              "key": "C 情绪行为",
              "value": "愤怒、指责、关系紧张。"
            }
          ],
          "next": "n29"
        },
        {
          "id": "n29",
          "type": "dialogue",
          "speaker": "小叶",
          "text": "所以 A 是小欧接电话，C 是我愤怒、指责、关系紧张。中间的 B 是我觉得她不尊重我，不在乎我。",
          "chars": [
            {
              "id": "wang",
              "pose": "default"
            },
            {
              "id": "xiaoye",
              "pose": "thinking",
              "active": true
            }
          ],
          "next": "n30"
        },
        {
          "id": "n30",
          "type": "dialogue",
          "speaker": "王老师",
          "text": "是的。我们不是说 A 不重要，而是说让情绪不断升级的，往往是你对 A 的解释。",
          "chars": [
            {
              "id": "wang",
              "pose": "point",
              "active": true
            },
            {
              "id": "xiaoye",
              "pose": "thinking"
            }
          ],
          "next": "n31"
        },
        {
          "id": "n31",
          "type": "dialogue",
          "speaker": "小叶",
          "text": "这和之前聊过的社会认知有点像。我看到的不是完整的小欧，而是“正在影响我复习的小欧”。",
          "chars": [
            {
              "id": "wang",
              "pose": "default"
            },
            {
              "id": "xiaoye",
              "pose": "thinking",
              "active": true
            }
          ],
          "next": "n32"
        },
        {
          "id": "n32",
          "type": "dialogue",
          "speaker": "王老师",
          "text": "很好。情绪管理不是把情绪删掉，而是看见情绪怎样改变了我们对事件和他人的解释。",

            {
              "id": "wang",
              "pose": "point",
              "active": true
            },
            {
              "id": "xiaoye",
              "pose": "thinking"
            }

        {
          "id": "t3",
          "type": "intertitle",
          "title": "第三幕",
          "subtitle": "心理健康课堂｜ABC练习",
          "bg": "assets/scenes/counseling_room.webp",

        },
        {
          "id": "n33",
          "type": "dialogue",
          "bg": "assets/scenes/counseling_room.webp",
          "speaker": "王老师",
          "text": "今天我们做一个练习。请大家把一次情绪波动拆成 A、B、C。",

            },

              "id": "xiaoye",
              "pose": "thinking"
            }

          "next": "n33b"

          "id": "n33b",
          "type": "dialogue",
          "bg": "assets/scenes/counseling_room.webp",

          "text": "A 是发生了什么，B 是我怎样解释它，C 是我产生了什么情绪和行为。",

              "id": "wang",
              "pose": "point",

              "pose": "thinking"
            }

        {

          "type": "dialogue",
          "speaker": "小叶",
          "text": "老师，如果我写出来的 B 很不好看怎么办？比如“她就是自私”“她根本不在乎我”。",

          "next": "n35"
        },
        {
          "id": "n35",
          "type": "dialogue",
          "speaker": "王老师",
          "text": "那正说明它值得被看见。写下 B 不是为了批判自己，而是为了让它从脑子里的唯一答案，变成一个可以被检查的想法。",
          "chars": [
            {
              "id": "wang",
              "pose": "point",
              "active": true
            },

              "id": "xiaoye",
              "pose": "thinking"
            }

          "next": "n36"
        },
        {

          "type": "dialogue",
          "speaker": "小叶",
          "text": "我以前会直接检查情绪，比如“我不该生气”。现在听起来，更重要的是检查生气背后的解释。",

              "pose": "default"

              "pose": "thinking",
              "active": true
            }
          ],
          "next": "n37"

          "type": "dialogue",

          "text": "对。压下去不等于管理，否定情绪也不等于理性。新的 B 不是强迫自己往好处想，而是更贴近事实，也更有行动空间。",

          "text": "这个 B 比较有弹性。它没有否认你的需要，也没有取消对方的感受。",

          "text": "如果我坚持“她就是自私，不尊重我”，我会觉得自己的愤怒很有道理。",

          "text": "是的，这个解释会给愤怒加燃料。它可能让你短时间觉得有力量，但也会让你更难听见对方。",
          "chars": [
            {
              "id": "wang",
              "pose": "point",
              "active": true
            },
            {
              "id": "xiaoye",
              "pose": "sad"
            }
          ],
          "next": "n38"
        },
        {
          "id": "op2_c",
          "type": "dialogue",
          "speaker": "小叶",
          "text": "我也会反过来想，都是我的错，我不该有情绪。",

          "next": "op2_c2"
        },
        {
          "id": "op2_c2",
          "type": "dialogue",
          "speaker": "王老师",
          "text": "这不是情绪管理，而是情绪否定。有情绪不等于你做错了。你要练习的是把“我很焦虑”和“我要怎么表达”分开。",

            {
              "id": "wang",
              "pose": "point",
              "active": true
            },
            {
              "id": "xiaoye",
              "pose": "thinking"
            }

          "next": "n38"
        },
        {
          "id": "n38",
          "type": "dialogue",
          "speaker": "王老师",
          "text": "情绪是信号，不是命令。信号提醒你：这里有需要、有压力、有边界。但它不一定能直接告诉你最合适的行动。",

            {
              "id": "wang",
              "pose": "point",
              "active": true
            },

              "id": "xiaoye",
              "pose": "thinking"

        {

          "type": "knowledge",
          "bg": "assets/scenes/counseling_room.webp",
          "title": "情绪管理：觉察、接纳与调节",
          "copy": "教材指出，情绪是人对客观事物是否符合自身需要而产生的态度体验。情绪管理不是否认情绪，而是在认识情绪特点的基础上，及时、恰当地表达、疏导和调节。",
          "dialogueKey": "k2_dialogue",
          "dialogueSpeaker": "王老师",
          "dialogueText": "你可以有情绪，但不让情绪替你说最伤人的话。",
          "items": [

          "text": "我想回去跟小欧说清楚。我不想让一次电话，变成我们之间一直绕不开的刺。",

      const restartButton = document.querySelector("[data-restart]");
      const audioToggleButton = document.querySelector("[data-audio-toggle]");
      const chapterChip = document.querySelector("[data-chapter-chip]");
      const CURRENT_PROJECT_TITLE =
        typeof PROJECT_TITLE === "string" && PROJECT_TITLE.trim()
          ? PROJECT_TITLE.trim()
          : document.title;
      document.title = CURRENT_PROJECT_TITLE;
      if (chapterChip) chapterChip.textContent = CURRENT_PROJECT_TITLE;

      const VOICE_PROFILES = {
        "小叶": { rate: 0.98, pitch: 1.12 },
        "小叶内心": { rate: 0.9, pitch: 1.04 },
        "小欧": { rate: 1.04, pitch: 1.16 },
        "小欧（电话中）": { rate: 1.06, pitch: 1.16 },
        "王老师": { rate: 0.92, pitch: 0.96 },
        "旁白": { rate: 0.94, pitch: 1 }
      };

      function stopVoice() {
        if (state.currentAudio) {
          state.currentAudio.pause();
          state.currentAudio.currentTime = 0;
          state.currentAudio = null;
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        state.currentUtterance = null;
      }

      function audioFileFor(key) {
        return `assets/audio/${key}.mp3`;
      }

      function voiceTextForNode(node) {
        if (node.type === "dialogue") return { key: node.id, speaker: node.speaker, text: node.text };
        if (node.type === "knowledge" && node.dialogueText) {
          return {
            key: node.dialogueKey || `${node.id}_dialogue`,
            speaker: node.dialogueSpeaker || "王老师",
            text: node.dialogueText
          };
        }
        return null;
      }

      function speakWithSynthesis(payload) {
        if (!("speechSynthesis" in window) || !payload?.text) return;
        const utterance = new SpeechSynthesisUtterance(payload.text.replace(/<[^>]+>/g, ""));
        const profile = VOICE_PROFILES[payload.speaker] || VOICE_PROFILES["旁白"];
        utterance.lang = "zh-CN";
        utterance.rate = profile.rate;
        utterance.pitch = profile.pitch;
        state.currentUtterance = utterance;
        window.speechSynthesis.speak(utterance);
      }

      function playVoice(payload) {
        stopVoice();
        if (!state.audioEnabled || !payload?.text) return;
        state.lastVoiceKey = payload.key;
        const audio = new Audio(audioFileFor(payload.key));
        state.currentAudio = audio;
        audio.addEventListener("error", () => {
          if (state.currentAudio === audio) {
            state.currentAudio = null;
            speakWithSynthesis(payload);
          }
        }, { once: true });
        audio.play().catch(() => {
          if (state.currentAudio === audio) {
            state.currentAudio = null;
            speakWithSynthesis(payload);
          }
        });
      }

      function playCurrentVoice() {
        playVoice(voiceTextForNode(currentNode()));
      }

      function updateAudioButton() {
        audioToggleButton.classList.toggle("is-active", state.audioEnabled);
        audioToggleButton.setAttribute("aria-label", state.audioEnabled ? "关闭配音" : "开启配音");
      }

      function nodeIndex(id) {
        return nodes.findIndex((item) => item.id === id);
      }

      function currentNode() {
        return nodes[state.index];
      }

      function setBackground(node) {
        if (node.bg) {
          bg.style.backgroundImage = `url("${node.bg}")`;
        }
        bg.style.filter = node.type === "intertitle" ? "brightness(0.2)" : "none";
      }

      function setProgress() {
        const percent = nodes.length <= 1 ? 100 : (state.index / (nodes.length - 1)) * 100;
        progress.style.width = `${Math.max(0, Math.min(100, percent))}%`;
      }

      function go(id) {
        const target = nodeIndex(id);
        if (target < 0) return;
        state.history.push(state.index);
        state.index = target;
        state.dialoguePage = 0;
        render();
      }

      function back() {
        const previous = state.history.pop();
        if (typeof previous !== "number") return;
        state.index = previous;
        state.dialoguePage = 0;
        render();
      }

      function restart() {
        stopVoice();
        state.index = 0;
        state.history = [];
        state.dialoguePage = 0;
        render();
      }

      function updateStageScale() {
        const width = stageWrap.getBoundingClientRect().width;
        stage.style.setProperty("--stage-scale", `${width / 1280}`);
      }

      function characterImage(spec, item) {
        return item.poses?.[spec.pose || "default"] || item.poses?.default;
      }

      function characterHtml(chars = []) {
        return `<div class="characters">${chars
          .map((spec) => {
            const item = characterMap[spec.id];
            if (!item) return "";
            const side = spec.id === "xiaoye" ? "right" : "left";
            const dim = spec.active ? "" : " dimmed";
            return `<div class="character ${side} visible${dim}"><img src="${characterImage(spec, item)}" alt="${item.name}" /></div>`;
          })
          .join("")}</div>`;
      }

      function dialogueSideClass(speaker) {
        return String(speaker || "").startsWith("小叶") ? "player-side" : "npc-side";
      }

      function continueButtonHtml(extraClass = "") {
        return `<button class="continue-button ${extraClass}" type="button" data-continue>继续</button>`;
      }

      function speakerStatusLabel(speaker) {
        const speakerText = String(speaker || "");
        const match = speakerText.match(/（[^）]+）/);
        if (match) {
          const status = match[0].slice(1, -1);
          const name = speakerText.slice(0, speakerText.indexOf(match[0]));
          if (status === "微信" && name) return `（${name}，微信）`;
          return match[0];
        }
        if (speakerText.includes("内心")) return "（内心）";
        return "";
      }

      function dialogueLineHtml(statusLabel, text) {
        return statusLabel ? `<span class="status-inline">${statusLabel}</span>${text}` : text;
      }

      function splitDialogueText(text, targetChars = 56) {
        const source = String(text || "").trim();
        const softMaxChars = 58;
        const hardMaxChars = 76;
        const minPageChars = 34;
        const minStrongTailChars = 16;
        const minWeakTailChars = 22;
        const strongPunctuation = "。！？；";
        const weakPunctuation = "，、 ";

        function compactLength(value) {
          return Array.from(String(value || "").replace(/[\s\u3000]/g, "")).length;
        }

        function canSplitAt(value, index, minTailChars) {
          const headLength = compactLength(value.slice(0, index + 1));
          const tailLength = compactLength(value.slice(index + 1));
          return headLength >= minPageChars && tailLength >= minTailChars;
        }

        function nearestPunctuationSplit(value, punctuation, minTailChars, limit) {
          let best = -1;
          let bestScore = Number.POSITIVE_INFINITY;
          const maxIndex = Math.min(value.length - 2, limit - 1);
          for (let i = 0; i <= maxIndex; i += 1) {
            if (!punctuation.includes(value[i]) || !canSplitAt(value, i, minTailChars)) continue;
            const headLength = compactLength(value.slice(0, i + 1));
            const distance = Math.abs(headLength - targetChars);
            const earlyPenalty = headLength < targetChars ? 4 : 0;
            const score = distance + earlyPenalty;
            if (score < bestScore) {
              best = i + 1;
              bestScore = score;
            }
          }
          return best;
        }

        function fallbackSplit(value) {
          const limit = Math.min(value.length - minStrongTailChars, hardMaxChars);
          for (let i = Math.min(limit, targetChars + 10); i >= minPageChars; i -= 1) {
            if (strongPunctuation.includes(value[i]) && canSplitAt(value, i, minStrongTailChars)) return i + 1;
          }
          for (let i = Math.min(limit, targetChars + 10); i >= minPageChars; i -= 1) {
            if (weakPunctuation.includes(value[i]) && canSplitAt(value, i, minWeakTailChars)) return i + 1;
          }
          return Math.min(targetChars, Math.max(minPageChars, value.length - minStrongTailChars));
        }

        if (compactLength(source) <= softMaxChars) return [source];

        const pages = [];
        let rest = source;
        while (compactLength(rest) > softMaxChars) {
          let splitAt = nearestPunctuationSplit(rest, strongPunctuation, minStrongTailChars, hardMaxChars);
          if (splitAt < 0) {
            splitAt = nearestPunctuationSplit(rest, weakPunctuation, minWeakTailChars, Math.min(hardMaxChars, targetChars + 8));
          }
          if (splitAt < 0) splitAt = fallbackSplit(rest);
          pages.push(rest.slice(0, splitAt).trim());
          rest = rest.slice(splitAt).trim();
        }
        if (rest) pages.push(rest);

        const previousPage = pages[pages.length - 2] || "";
        const lastPage = pages[pages.length - 1] || "";
        const previousEndsStrong = strongPunctuation.includes(previousPage[previousPage.length - 1]);
        if (pages.length > 1 && compactLength(lastPage) < minStrongTailChars && !previousEndsStrong) {
          const tail = pages.pop();
          const previous = pages.pop();
          const merged = `${previous}${tail}`;
          let splitAt = nearestPunctuationSplit(merged, strongPunctuation, minStrongTailChars, hardMaxChars);
          if (splitAt < 0) {
            splitAt = nearestPunctuationSplit(merged, weakPunctuation, minWeakTailChars, Math.min(hardMaxChars, targetChars + 8));
          }
          if (splitAt < 0) splitAt = fallbackSplit(merged);
          pages.push(merged.slice(0, splitAt).trim(), merged.slice(splitAt).trim());
        }
        return pages.filter(Boolean);
      }

      function dialoguePages(node) {
        if (node.type === "dialogue") return splitDialogueText(node.text);
        if (node.type === "knowledge" && node.dialogueText) return splitDialogueText(node.dialogueText);
        return [];
      }

      function currentDialogueText(node) {
        const pages = dialoguePages(node);
        if (!pages.length) return "";
        const page = Math.max(0, Math.min(state.dialoguePage, pages.length - 1));
        return pages[page];
      }

      function advanceDialoguePage(node) {
        const pages = dialoguePages(node);
        if (pages.length <= 1 || state.dialoguePage >= pages.length - 1) return false;
        state.dialoguePage += 1;
        render(false);
        return true;
      }

      function dialogueHtml(node) {
        const color = SPEAKER_COLORS[node.speaker] || SPEAKER_COLORS["旁白"];
        const sideClass = dialogueSideClass(node.speaker);
        const text = currentDialogueText(node);
        const statusLabel = speakerStatusLabel(node.speaker);
        const displayText = dialogueLineHtml(statusLabel, text);
        return `
          ${characterHtml(node.chars)}
          <section class="dialogue ${sideClass}" style="--speaker-color:${color}">
            <div class="dialogue-content no-speaker">
              <p class="line">${displayText}</p>
            </div>
            ${continueButtonHtml()}
          </section>
        `;
      }

      function renderCover(node) {
        screen.innerHTML = `
          <section class="cover" style="--cover-bg:url('${node.bg}')">
            <div>
              <h1>${node.title}</h1>
              ${node.subtitleTitle ? `<p class="subtitle-title">${node.subtitleTitle}</p>` : ""}
              <p class="subtitle">${node.subtitle}</p>
              <button class="start-button" type="button" data-continue>开始</button>
            </div>
            <div class="cover-people" aria-hidden="true">
              <img class="xiaoye" src="${node.people[0]}" alt="" />
              <img class="xiaoou" src="${node.people[1]}" alt="" />
            </div>
          </section>
        `;
      }

      function renderIntertitle(node) {
        screen.innerHTML = `
          <section class="intertitle" style="--intertitle-bg:url('${node.bg}')">
            <div>
              <h2>${node.title}</h2>
              ${node.subtitleTitle ? `<p class="subtitle-title">${node.subtitleTitle}</p>` : ""}
              <p>${node.subtitle}</p>
              ${continueButtonHtml()}
            </div>
          </section>
        `;
      }

      function renderChoice(node) {
        screen.innerHTML = `
          <div class="choice-character-layer">${characterHtml(node.chars)}</div>
          <section class="choice-panel">
            <p class="choice-question">${node.prompt}</p>
            ${node.options
              .map((option, index) => `<button class="choice-button" type="button" data-option="${index}">${String.fromCharCode(65 + index)}. ${option.label}</button>`)
              .join("")}
          </section>
          <section class="dialogue system-dialogue">
            <div class="dialogue-content no-speaker">
              <p class="line">选择会改变小叶对情绪的理解，也会影响关系中的下一句话。</p>
            </div>
          </section>
        `;
      }

      function renderFeedback(option) {
        screen.insertAdjacentHTML(
          "beforeend",
          `<section class="feedback-panel">
            <h3>即时反馈</h3>
            <p>${option.feedback}</p>
            <div class="feedback-actions">
              <button class="continue-button" type="button" data-feedback-next>继续剧情</button>
            </div>
          </section>`
        );
      }

      function renderKnowledge(node) {
        const dialogueSpeaker = node.dialogueSpeaker || "王老师";
        const color = SPEAKER_COLORS[dialogueSpeaker] || SPEAKER_COLORS["王老师"];
        const sideClass = dialogueSideClass(dialogueSpeaker);
        const statusLabel = speakerStatusLabel(dialogueSpeaker);
        const dialogueText = currentDialogueText(node);
        const displayText = dialogueLineHtml(statusLabel, dialogueText);
        const titleLength = Array.from(String(node.title || "").replace(/[\s\u3000]/g, "")).length;
        const titleClass = titleLength > 20 ? "title-ultra-long" : titleLength > 15 ? "title-extra-long" : titleLength > 10 ? "title-long" : "";
        screen.innerHTML = `
          <section class="knowledge">
            <img class="teacher-figure" src="${ASSETS.wang}" alt="王老师" />
            <div class="knowledge-content">
              <h2 class="${titleClass}">${node.title}</h2>
              <p class="knowledge-copy">${node.copy}</p>
              <div class="abc-grid count-${node.items.length}">
                ${node.items.map((item) => `<div class="abc-item"><strong>${item.key}</strong><p>${item.value}</p></div>`).join("")}
              </div>
            </div>
          </section>
          <section class="dialogue ${sideClass}" style="--speaker-color:${color}">
            <div class="dialogue-content no-speaker">
              <p class="line">${displayText}</p>
            </div>
            ${continueButtonHtml()}
          </section>
        `;
      }

      function renderEnding(node) {
        screen.innerHTML = `
          <section class="ending" style="--ending-bg:url('${node.bg}')">
            <div class="ending-box">
              <h2>${node.title}</h2>
              <p>${node.text}</p>
              <div class="ending-actions">
                <button class="secondary-button" type="button" data-restart>再看一次</button>
              </div>
            </div>
          </section>
        `;
      }

      function render(playVoiceForNode = true) {
        const node = currentNode();
        stage.dataset.mode = node.type;
        setBackground(node);
        setProgress();

        if (node.type === "cover") renderCover(node);
        if (node.type === "intertitle") renderIntertitle(node);
        if (node.type === "dialogue") screen.innerHTML = dialogueHtml(node);
        if (node.type === "choice") renderChoice(node);
        if (node.type === "knowledge") renderKnowledge(node);
        if (node.type === "ending") renderEnding(node);

        backButton.disabled = state.history.length === 0;
        updateAudioButton();
        if (playVoiceForNode) playCurrentVoice();
      }

      screen.addEventListener("click", (event) => {
        const node = currentNode();
        const continueButton = event.target.closest("[data-continue]");
        const optionButton = event.target.closest("[data-option]");
        const feedbackButton = event.target.closest("[data-feedback-next]");
        const restartInScreen = event.target.closest("[data-restart]");

        if (continueButton && node.next) {
          if (advanceDialoguePage(node)) return;
          go(node.next);
        }
        if (optionButton && node.type === "choice") {
          const optionIndex = Number(optionButton.dataset.option);
          const option = node.options[optionIndex];
          if (!option) return;
          renderFeedback({ ...option, index: optionIndex });
          screen.querySelectorAll(".choice-button").forEach((button) => (button.disabled = true));
          screen.querySelector("[data-feedback-next]").addEventListener("click", () => go(option.next), { once: true });
        }
        if (feedbackButton) return;
        if (restartInScreen) restart();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          const node = currentNode();
          if (node.type !== "choice" && node.next) {
            event.preventDefault();
            if (advanceDialoguePage(node)) return;
            go(node.next);
          }
        }
      });

      backButton.addEventListener("click", back);
      restartButton.addEventListener("click", restart);
      audioToggleButton.addEventListener("click", () => {
        state.audioEnabled = !state.audioEnabled;
        updateAudioButton();
        if (state.audioEnabled) {
          playCurrentVoice();
        } else {
          stopVoice();
        }
      });
      window.addEventListener("resize", updateStageScale);

      updateStageScale();
      render();
    </script>
  </body>
</html>
