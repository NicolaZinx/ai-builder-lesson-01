<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>概念配对实验室</title><style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#203553;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;padding:clamp(18px,4vw,44px);min-height:100vh;background:radial-gradient(circle at 15% 0,#fff,transparent 55%),linear-gradient(135deg,#edf3ff,#f9f5eb)}main{max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:12px;letter-spacing:.13em;color:#7489a8}h1{font-size:clamp(28px,4vw,42px);margin:8px 0}p{color:#58708d;line-height:1.7;margin:7px 0}.counts{display:flex;gap:24px;white-space:nowrap}.counts b{font-size:29px;font-weight:600;display:block}.counts span{font-size:13px;color:#627a96}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #fff;color:#314d71;background:#ffffffb0;border-radius:18px;padding:12px 22px;box-shadow:0 10px 28px -22px #405d8f80}button:focus-visible{outline:3px solid #bd913b;outline-offset:3px}.tile{height:135px;font-size:22px;position:relative;transition:transform .2s,background .2s,opacity .2s;border-bottom:3px solid #c9d9ed;background:linear-gradient(140deg,#ffffffb0,#e6eef8b0)}.tile:hover{transform:translateY(-3px)}.tile:disabled{cursor:default}.tile .back{color:#9aacc5;font-weight:300;font-size:32px}.tile.open{background:#fffef9;border-bottom-color:#d6ba78}.tile.open .term{font-weight:600}.tile .definition{font-size:17px;line-height:1.6;display:block}.tile.matched{background:#e5efeb;border-bottom-color:#9abaae;opacity:.68}.tile.matched:after{content:'✓';position:absolute;right:10px;top:6px;color:#527769;font-size:16px}footer{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}#message{color:#52718e}dialog{border:1px solid #fff;border-radius:25px;padding:32px;max-width:420px;color:#294566;background:#f7faff}dialog::backdrop{background:#e1e9f2bb;backdrop-filter:blur(8px)}dialog h2{margin-top:0}@media(max-width:600px){header{align-items:flex-start}.counts{gap:13px}.counts b{font-size:24px}#grid{grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.tile{height:116px;padding:10px 6px;font-size:19px}.tile .definition{font-size:14px}.tile .back{font-size:28px}p{font-size:14px}body{padding:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.tile:hover{transform:none}}
</style><main><header><div><div class="eyebrow">RECALL · CONNECT · UNDERSTAND</div><h1>概念配对实验室</h1><p>翻开两张卡，把术语与定义配成一对。</p></div><div class="counts"><div><b id="moves">0</b><span>翻牌轮次</span></div><div><b id="pairs">0 / 6</b><span>已配对</span></div></div></header><div id="grid" aria-label="12张配对卡片"></div><footer><span id="message" role="status" aria-live="polite">每轮翻两张；匹配后保留，不匹配则盖回。</span><button id="reset">重新开始</button></footer><p>键盘：Tab 选择卡片，Enter 翻开；方向键移动焦点。</p></main><dialog id="paused"><h2>已暂停</h2><p>回到游戏后继续，已翻开的卡片和进度都会保留。</p><button id="resume">继续游戏</button></dialog><script>
(()=>{'use strict';const pairs=[['Bug','程序表现不符合预期'],['Buff','短时间增强角色能力的效果'],['NPC','不由玩家直接控制的角色'],['原型','用于验证核心玩法的可运行版本'],['反馈','操作后系统返回的可感知结果'],['迭代','依据测试结果逐步修改产品']];const $=x=>document.getElementById(x);let cards=[],opened=[],matched=0,moves=0,remaining=0,paused=false,last=performance.now(),started=false;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){cards=shuffle(pairs.flatMap((p,id)=>p.map((text,side)=>({id,text,side,matched:false}))));opened=[];matched=0;moves=0;remaining=0;paused=false;started=false;if($('paused').open)$('paused').close();$('moves').textContent='0';$('pairs').textContent='0 / 6';$('message').textContent='每轮翻两张；匹配后保留，不匹配则盖回。';$('grid').innerHTML='';cards.forEach((c,i)=>{const b=document.createElement('button');b.className='tile';b.dataset.pair=c.id;b.dataset.side=c.side;b.dataset.index=i;b.setAttribute('aria-label',`翻开第${i+1}张卡片`);b.innerHTML='<span class="back">◇</span>';b.onclick=()=>flip(i);b.onkeydown=e=>{const cols=innerWidth<=600?3:4;let n=i;if(e.key==='ArrowRight')n=i+1;else if(e.key==='ArrowLeft')n=i-1;else if(e.key==='ArrowDown')n=i+cols;else if(e.key==='ArrowUp')n=i-cols;else return;e.preventDefault();const targets=[...$('grid').children];if(n>=0&&n<12)targets[n].focus()};$('grid').append(b)})}function paint(i){const c=cards[i],b=$('grid').children[i];b.classList.toggle('open',opened.includes(i)||c.matched);b.classList.toggle('matched',c.matched);b.disabled=c.matched;b.innerHTML=opened.includes(i)||c.matched?`<span class="${c.side?'definition':'term'}">${c.text}</span>`:'<span class="back">◇</span>';b.setAttribute('aria-label',c.matched?`已配对：${c.text}`:opened.includes(i)?c.text:`翻开第${i+1}张卡片`)}function flip(i){if(paused||remaining>0||cards[i].matched||opened.includes(i))return;started=true;opened.push(i);paint(i);if(opened.length===2){moves++;$('moves').textContent=moves;remaining=cards[opened[0]].id===cards[opened[1]].id?.55:.8;$('message').textContent=cards[opened[0]].id===cards[opened[1]].id?'匹配正确':'回忆它们的位置，再试一次'}}function resolve(){if(opened.length!==2)return;const a=opened[0],b=opened[1];if(cards[a].id===cards[b].id){cards[a].matched=cards[b].matched=true;matched++;$('pairs').textContent=`${matched} / 6`;}opened=[];paint(a);paint(b);$('message').textContent=matched===6?`全部完成！你用 ${moves} 轮找到了6组概念。`:'继续寻找下一对术语与定义。'}function pause(){if(!started||matched===6||paused)return;paused=true;$('paused').showModal()}function resume(){paused=false;$('paused').close();last=performance.now()}function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!paused&&remaining>0){remaining-=dt;if(remaining<=0){remaining=0;resolve()}}requestAnimationFrame(loop)}$('reset').onclick=start;$('resume').onclick=resume;$('paused').addEventListener('cancel',e=>{e.preventDefault();resume()});window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});start();requestAnimationFrame(loop);window.gameState=()=>({matched,moves,remaining,paused,opened:[...opened]});})();
</script></html>
