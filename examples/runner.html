<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>校园补给跑</title><style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#203553;background:#f0f4fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fff,transparent 50%),linear-gradient(130deg,#eef3ff,#f8f5ed);min-height:100vh;padding:clamp(18px,4vw,50px)}main{max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(28px,4vw,44px);margin:8px 0}p{color:#526780;line-height:1.8;margin:6px 0}.eyebrow{font-size:13px;letter-spacing:.13em;color:#7184a0}.score{font-size:36px;font-weight:600;white-space:nowrap}.score small{font-size:16px;color:#70819a}section{position:relative;margin:24px 0 18px;background:#ffffff90;border:1px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 25px 65px -30px #4c6a9b55,inset 0 1px #fff}canvas{display:block;width:100%;aspect-ratio:5/2;touch-action:manipulation}.overlay{position:absolute;inset:0;background:#f5f8fddf;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay[hidden]{display:none}.overlay h2{font-size:clamp(23px,3.5vw,38px);margin:0 0 10px}.overlay p{max-width:440px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button{font:inherit;border:1px solid #fff;background:#ffffffbd;color:#294267;border-radius:15px;padding:13px 22px;cursor:pointer;box-shadow:0 5px 20px -12px #325d8f70}button.primary{background:#3e65a4;color:white;border-color:#3e65a4}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #c89934;outline-offset:3px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.rules div{padding:16px 20px;border:1px solid #fff;border-radius:18px;background:#ffffff75;font-size:14px;line-height:1.7;color:#576e88}.rules b{display:block;color:#314e73;font-size:16px;margin-bottom:4px}#status{margin-left:auto;color:#60758e;font-size:14px}#jump{min-width:140px}@media(max-width:600px){body{padding:18px}header{align-items:flex-start}.score{font-size:28px}section{margin-top:18px;border-radius:20px}canvas{aspect-ratio:5/3}.rules{grid-template-columns:1fr;gap:8px}.rules div{padding:10px 15px}.rules b{display:inline;margin-right:8px}#status{width:100%;margin:0}.controls{gap:8px}button{padding:11px 16px}.overlay p{font-size:13px}.overlay h2{margin-bottom:3px}}@media(prefers-reduced-transparency:reduce){section,.rules div,.overlay{background:#f7faff;backdrop-filter:none}}</style>
<main><header><div><div class="eyebrow">PLAY · TEST · ITERATE</div><h1>校园补给跑</h1><p>越过路障，收集补给，把原型跑起来。</p></div><div class="score"><span id="score">0</span><small> / 30</small></div></header><section><canvas id="world" width="1000" height="400" aria-label="校园跑酷游戏，使用下方跳跃按钮或空格操作"></canvas><div class="overlay" id="overlay"><div><h2 id="headline">从第一跳开始</h2><p id="message">点击开始。空格、轻点画面或“跳跃”按钮起跳；避开路障，获得30分即可完成。</p><button class="primary" id="start">开始游戏</button></div></div></section><div class="controls"><button class="primary" id="jump" disabled>跳跃 ↑</button><button id="pause" disabled>暂停</button><button id="restart">重新开始</button><span id="status" role="status" aria-live="polite">准备就绪</span></div><div class="rules"><div><b>越过障碍 +1</b>碰到路障结束；落地后才能再次跳跃。</div><div><b>收集补给 +1</b>金色圆点可加分；达到30分完成挑战。</div><div><b>蓝色护盾 · 3秒</b>经过盾牌获得保护，期间碰撞不结束。</div></div></main>
<script>
(()=>{'use strict';const c=document.getElementById('world'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);const W=1000,H=400,G=314;let mode='ready',score=0,elapsed=0,last=0,next=1.5,nextShield=6,shield=0,player={x:145,y:G-42,vy:0,w:30,h:42},items=[];let runId=0;
function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function scoreAdd(n){score=Math.min(30,score+n);$('score').textContent=score;if(score>=30)finish(true)}
function setMode(v){mode=v;$('jump').disabled=v!=='playing';$('pause').disabled=v!=='playing'&&v!=='paused';$('pause').textContent=v==='paused'?'继续':'暂停'}
function show(title,msg,label){$('headline').textContent=title;$('message').textContent=msg;$('start').textContent=label;$('overlay').hidden=false}
function reset(){runId++;score=0;elapsed=0;next=1.5;nextShield=6;shield=0;items=[];player.y=G-player.h;player.vy=0;$('score').textContent='0';setMode('playing');$('overlay').hidden=true;$('status').textContent='向前，注意路障';last=performance.now()}
function finish(win){setMode(win?'won':'lost');show(win?'30分，挑战完成':'这次跑到这里',win?'你的游戏已具备开始、操作、计分与结束的完整流程。':'再试一次：在路障靠近时起跳，注意落地节奏。','再玩一次');$('status').textContent=win?'已完成挑战':`本次 ${score} 分`}
function pause(){if(mode!=='playing')return;setMode('paused');show('已暂停','准备好后继续，进度会保留。','继续游戏');$('status').textContent='已暂停'}
function resume(){if(mode!=='paused')return;setMode('playing');$('overlay').hidden=true;last=performance.now();$('status').textContent='继续前进'}
function jump(){if(mode==='playing'&&player.y>=G-player.h-.5){player.vy=-660}}
function collide(a){return player.x+player.w-4>a.x&&player.x+4<a.x+a.w&&player.y+player.h-3>a.y&&player.y+3<a.y+a.h}
function tick(dt){elapsed+=dt;shield=Math.max(0,shield-dt);player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y>G-player.h){player.y=G-player.h;player.vy=0}if(elapsed>=next){items.push({type:'obstacle',x:W+30,y:G-36,w:29,h:36,done:false});items.push({type:'coin',x:W+190,y:G-58,w:20,h:20,done:false});next=elapsed+1.75}if(elapsed>=nextShield){items.push({type:'shield',x:W+30,y:G-39,w:27,h:33,done:false});nextShield=elapsed+9}for(const a of items){a.x-=300*dt;if(!a.done&&collide(a)){a.done=true;if(a.type==='obstacle'){if(shield<=0){finish(false);break}else scoreAdd(1)}else if(a.type==='coin'){scoreAdd(1)}else{shield=3;$('status').textContent='护盾已开启 · 3秒'} }if(!a.done&&a.type==='obstacle'&&a.x+a.w<player.x){a.done=true;scoreAdd(1)}if(mode!=='playing')break}items=items.filter(a=>a.x>-60);if(shield>0)$('status').textContent=`护盾保护 · ${Math.ceil(shield)}秒`;else if(mode==='playing')$('status').textContent='空格 / 轻点画面跳跃'}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#eaf2ff');sky.addColorStop(1,'#faf8f0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f3dfae';ctx.beginPath();ctx.arc(825,80,39,0,Math.PI*2);ctx.fill();const shift=elapsed*16;for(let i=-1;i<7;i++){let x=i*190-shift%190;rect(x,173,140,140,6,'#dce7f3');rect(x+14,155,112,18,4,'#c4d5e8');for(let j=0;j<4;j++)for(let k=0;k<3;k++)rect(x+17+j*28,191+k*34,13,18,3,'#f7fbff')}ctx.fillStyle='#cadacb';ctx.fillRect(0,G,W,6);ctx.fillStyle='#e4eaf0';ctx.fillRect(0,G+6,W,H-G);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([35,22]);ctx.beginPath();ctx.moveTo(-elapsed*300%57,G+48);ctx.lineTo(W,G+48);ctx.stroke();ctx.setLineDash([]);for(const a of items){if(a.done)continue;if(a.type==='obstacle'){rect(a.x,a.y,a.w,a.h,5,'#c88a64');rect(a.x+3,a.y+7,a.w-6,6,2,'#f8e1c0');rect(a.x+3,a.y+23,a.w-6,6,2,'#f8e1c0')}else if(a.type==='coin'){ctx.fillStyle='#dab557';ctx.beginPath();ctx.arc(a.x+10,a.y+10,10,0,7);ctx.fill();ctx.strokeStyle='#fff1bd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a.x+10,a.y+10,6,0,7);ctx.stroke()}else{ctx.fillStyle='#6199c5';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+a.w,a.y);ctx.lineTo(a.x+a.w-3,a.y+22);ctx.lineTo(a.x+a.w/2,a.y+a.h);ctx.lineTo(a.x+3,a.y+22);ctx.closePath();ctx.fill();ctx.fillStyle='white';ctx.font='20px sans-serif';ctx.fillText('+',a.x+7,a.y+23)}}ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#9aa9bc33';ctx.beginPath();ctx.ellipse(16,G-player.y+5,25,5,0,0,7);ctx.fill();if(shield>0){ctx.strokeStyle='#d4ae53';ctx.lineWidth=3;ctx.fillStyle='#f4ddb344';ctx.beginPath();ctx.ellipse(15,18,30,38,0,0,7);ctx.fill();ctx.stroke()}rect(3,14,25,25,7,'#4772ac');rect(8,0,17,19,8,'#e1ba96');rect(6,-3,20,8,5,'#29496b');rect(2,36,11,8,3,'#29496b');rect(19,36,11,8,3,'#29496b');rect(-4,17,10,20,4,'#c6a050');ctx.restore()}
function loop(t){let dt=Math.min((t-last)/1000,.035);last=t;if(mode==='playing')tick(dt);draw();requestAnimationFrame(loop)}$('start').onclick=()=>mode==='paused'?resume():reset();$('restart').onclick=reset;$('pause').onclick=()=>mode==='paused'?resume():pause();$('jump').onclick=jump;c.addEventListener('pointerdown',jump);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();if(mode==='ready')reset();else jump()}else if(e.key.toLowerCase()==='p'){e.preventDefault();mode==='paused'?resume():pause()}else if(e.key.toLowerCase()==='r'){reset()}});window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});last=performance.now();requestAnimationFrame(loop);window.gameState=()=>({mode,score,elapsed,shield,player:{...player},items:items.map(a=>({...a})),runId});})();
</script></html>
